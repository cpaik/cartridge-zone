name: Community shelf

# Submissions arrive as issues from the forms in .github/ISSUE_TEMPLATE.
# Opening or editing one runs a check and comments; a maintainer adding the
# "approved" label publishes it to community/ and rebuilds the site.
on:
  issues:
    types: [opened, edited, labeled]

permissions:
  contents: write
  issues: write
  pages: write

concurrency:
  group: community-shelf
  cancel-in-progress: false

jobs:
  shelf:
    if: startsWith(github.event.issue.title, '[cart]') || startsWith(github.event.issue.title, '[game]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check or publish
        id: shelf
        env:
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
        run: |
          MODE=validate
          if [ "$ACTION" = "labeled" ] && [ "$LABEL" = "approved" ]; then MODE=publish; fi
          if [ "$ACTION" = "labeled" ] && [ "$MODE" = "validate" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          node scripts/shelf.mjs "$MODE"

      - name: Commit to the shelf
        if: steps.shelf.outputs.published == 'true'
        env:
          ITEM: ${{ steps.shelf.outputs.id }}
        run: |
          git config user.name "cartridge-zone-shelf"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add community
          git commit -m "Shelf: publish $ITEM"
          git push

      - name: Comment, label, close, rebuild
        if: steps.shelf.outputs.skip != 'true'
        uses: actions/github-script@v7
        env:
          PUBLISHED: ${{ steps.shelf.outputs.published }}
        with:
          script: |
            const fs = require("fs");
            const {owner, repo} = context.repo, issue_number = context.issue.number;
            for (const [name, color, description] of [["submission", "7c5cff", "A cart or game submitted to the shelf"], ["approved", "b6f23a", "Publish this submission to the shelf"]]) {
              try { await github.rest.issues.createLabel({owner, repo, name, color, description}); } catch (e) {}
            }
            if (context.payload.action === "opened") await github.rest.issues.addLabels({owner, repo, issue_number, labels: ["submission"]});
            await github.rest.issues.createComment({owner, repo, issue_number, body: fs.readFileSync("shelf-comment.md", "utf8")});
            if (process.env.PUBLISHED === "true") {
              await github.rest.issues.update({owner, repo, issue_number, state: "closed", state_reason: "completed"});
              try { await github.rest.repos.requestPagesBuild({owner, repo}); } catch (e) { core.warning("Pages rebuild request failed: " + e.message); }
            }

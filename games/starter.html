<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Cartridge Zone game</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#16171b;color:#efede6;font:17px/1.5 system-ui,sans-serif;padding:20px}
  main{width:min(520px,100%);display:grid;gap:12px}
  #log{min-height:200px;background:#212329;border-radius:10px;padding:14px;white-space:pre-wrap}
  form{display:flex;gap:8px} input{flex:1;font:inherit;padding:10px;border-radius:8px;border:1px solid #444;background:#111;color:inherit}
  button{font:inherit;padding:10px 16px;border-radius:8px;border:0;background:#ff5b1f;color:#1a0d05;font-weight:700}
</style>
</head>
<body>
<main>
  <h1>My game</h1>
  <div id="log">Say something to start.</div>
  <form id="f"><input id="say" placeholder="Type here" aria-label="Your move"><button>Send</button></form>
</main>
<script>
// Your game can call the standard OpenAI chat API. Cartridge Zone answers it with the model
// running on the player's own GPU. No API key, no server, and no network access from the game.
const history = [{role: "system", content: "You are a friendly innkeeper in a fantasy tavern. Reply in one or two sentences."}];
document.getElementById("f").onsubmit = async e => {
  e.preventDefault();
  const text = document.getElementById("say").value.trim(); if (!text) return;
  document.getElementById("say").value = "";
  history.push({role: "user", content: text});
  const res = await fetch("/v1/chat/completions", {method: "POST", body: JSON.stringify({messages: history, max_tokens: 80})});
  const reply = (await res.json()).choices[0].message.content;
  history.push({role: "assistant", content: reply});
  document.getElementById("log").textContent += "\n\nYou: " + text + "\nInnkeeper: " + reply;
};
// Tips: keep game logic (scores, dice, inventory) in your own code and let the model write the words.
// Small in-browser models are good at short in-character lines and bad at keeping score.
</script>
</body>
</html>
